<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 퀴즈 앱</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .quiz-container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        .image-box {
            width: 100%;
            height: 220px;
            background-color: #eee;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            background-color: #e2e6ea;
            border-color: #adb5bd;
        }
        #score-container {
            display: none;
        }
        .restart-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- 퀴즈 화면 -->
    <div id="quiz-screen">
        <h2 id="question-text">문제가 여기에 나타납니다.</h2>
        <div class="image-box">
            <img id="quiz-image" src="" alt="퀴즈 이미지">
        </div>
        <div class="options-container" id="options-box">
            <!-- 버튼들이 자바스크립트로 동적 생성됩니다 -->
        </div>
    </div>

    <!-- 결과 화면 -->
    <div id="score-container">
        <h2>퀴즈가 끝났습니다! 🎉</h2>
        <p id="final-score" style="font-size: 1.2rem; margin: 20px 0;"></p>
        <button class="restart-btn" onclick="restartQuiz()">다시 풀기</button>
    </div>
</div>

<script>
    const quizData = [
        {
            question: "Q1. 다음 사진 속 건축물의 이름은 무엇일까요?",
            image: "https://images.unsplash.com/photo-1511739001486-6bfe10ce785f?auto=format&fit=crop&w=600&q=80",
            options: ["자유의 여신상", "에펠탑", "빅벤", "콜로세움"],
            answer: 1
        },
        {
            question: "Q2. 다음 표지판이 의미하는 올바른 표현은 무엇일까요?",
            image: "https://images.unsplash.com/photo-1485965120184-e220f721d03e?auto=format&fit=crop&w=600&q=80",
            options: ["No Parking", "No Bicycle", "Turn Left", "Wet Floor"],
            answer: 1
        },
        {
            question: "Q3. 다음 중 밤하늘의 별을 모티브로 한 대표적인 국기, 어느 나라인가요?",
            image: "https://images.unsplash.com/photo-1617953141905-b539cf72826e?auto=format&fit=crop&w=600&q=80",
            options: ["대한민국", "미국", "영국", "독일"],
            answer: 1
        }
    ];

    let currentQuestion = 0;
    let score = 0;

    const questionText = document.getElementById("question-text");
    const quizImage = document.getElementById("quiz-image");
    const optionsBox = document.getElementById("options-box");
    const quizScreen = document.getElementById("quiz-screen");
    const scoreContainer = document.getElementById("score-container");
    const finalScore = document.getElementById("final-score");

    function loadQuiz() {
        const currentQuiz = quizData[currentQuestion];
        questionText.innerText = currentQuiz.question;
        quizImage.src = currentQuiz.image;
        optionsBox.innerHTML = "";

        currentQuiz.options.forEach((option, index) => {
            const button = document.createElement("button");
            button.classList.add("option-btn");
            button.innerText = option;
            button.onclick = () => selectAnswer(index);
            optionsBox.appendChild(button);
        });
    }

    function selectAnswer(selectedIndex) {
        const currentQuiz = quizData[currentQuestion];
        if (selectedIndex === currentQuiz.answer) {
            score++;
        }

        currentQuestion++;
        if (currentQuestion < quizData.length) {
            loadQuiz();
        } else {
            showScore();
        }
    }

    function showScore() {
        quizScreen.style.display = "none";
        scoreContainer.style.display = "block";
        finalScore.innerText = `총 ${quizData.length}문제 중 ${score}문제를 맞혔습니다!`;
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        scoreContainer.style.display = "none";
        quizScreen.style.display = "block";
        loadQuiz();
    }

    // 초기 실행
    loadQuiz();
</script>

</body>
</html>
